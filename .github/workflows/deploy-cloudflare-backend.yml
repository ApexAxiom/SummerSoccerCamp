name: Deploy Cloudflare backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noahscompany-backend-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: '22'
      - run: npm run check && npm test
      - run: npm ci --prefix cloudflare --ignore-scripts --no-audit --no-fund
      - run: npm --prefix cloudflare run check && npm --prefix cloudflare run build && npm --prefix cloudflare test
      - name: Resolve real production binding and explicit activation flag
        env:
          NOAH_D1_DATABASE_ID: ${{ vars.NOAH_D1_DATABASE_ID }}
          NOAH_BACKEND_ENABLED: ${{ vars.NOAH_BACKEND_ENABLED }}
          NOAH_BACKEND_VARS_JSON: ${{ vars.NOAH_BACKEND_VARS_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('cloudflare/wrangler.jsonc','utf8'));
          const id=process.env.NOAH_D1_DATABASE_ID;
          assert.match(id || '',/^[a-f0-9-]{36}$/i);
          const enabled=process.env.NOAH_BACKEND_ENABLED || 'false';
          assert.ok(['true','false'].includes(enabled));
          const values=JSON.parse(process.env.NOAH_BACKEND_VARS_JSON || '{}');
          const allowed=new Set(['STRIPE_GROUP_PRICE_ID','STRIPE_PRIVATE_PRICE_ID','CONTACT_EMAIL','CONTACT_PHONE','COACH_EMAIL','MAIL_FROM','GROUP_DISPLAY_PRICE','PRIVATE_DISPLAY_PRICE']);
          for(const [key,value] of Object.entries(values)) { assert.ok(allowed.has(key)); assert.equal(typeof value,'string'); }
          config.d1_databases[0].database_id=id;
          config.vars={...config.vars,...values,BACKEND_ENABLED:enabled};
          config.routes=[{pattern:'api.noahscompany.com',custom_domain:true}];
          if(enabled==='true') config.triggers={crons:['*/5 * * * *']};
          writeFileSync('cloudflare/release-config.json',JSON.stringify(config));
          NODE
      - name: Deploy reviewed Worker; leave data migration and secrets to the private operator path
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_main" = "$GITHUB_SHA"
          npx --no-install wrangler deploy --config release-config.json
